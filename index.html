<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Troll List</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 45%, #020617 100%);
      color: #e5e7eb;
      font-family: Arial, Helvetica, sans-serif;
      padding: 2rem;
      box-sizing: border-box;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 2rem;
      color: #f8fafc;
    }

    .profile-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    .top-row {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    input,
    textarea {
      width: 100%;
      background: #020617;
      color: #e5e7eb;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 12px;
      padding: 0.9rem;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      margin-bottom: 1rem;
    }

    input:focus,
    textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
      font-weight: bold;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.8rem;
    }

    .image-box {
      height: 120px;
      border: 2px dashed rgba(148, 163, 184, 0.35);
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #64748b;
      font-size: 0.85rem;
      overflow: hidden;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      color: #64748b;
      font-size: 0.9rem;
    }

    @media (max-width: 800px) {
      .top-row {
        grid-template-columns: 1fr;
      }

      .image-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Troll List</h1>

    <div id="profiles"></div>

    <footer>© by therescaper</footer>
  </div>

  <script>
    const profilesContainer = document.getElementById("profiles");

    for (let i = 1; i <= 20; i++) {
      const card = document.createElement("div");
      card.className = "profile-card";

      let images = "";

      for (let j = 1; j <= 20; j++) {
        images += `<div class="image-box">Image ${j}</div>`;
      }

      card.innerHTML = `
        <div class="top-row">
          <div>
            <label>Username ${i}</label>
            <input type="text" placeholder="Enter username..." />
          </div>

          <div>
            <label>Date</label>
            <input type="date" />
          </div>
        </div>

        <label>Explanation</label>
        <textarea placeholder="Explain why this player is on the troll list..."></textarea>

        <label>Proof / Screenshots</label>
        <div class="image-grid">
          ${images}
        </div>
      `;

      profilesContainer.appendChild(card);
    }
  </script>
</body>
</html>
