  <title>Troll List</title>

  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 45%, #020617 100%);
      color: #e5e7eb;
      font-family: Arial, Helvetica, sans-serif;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 2rem;
    }

    .profile-card {
      background: rgba(15, 23, 42, 0.9);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
      font-weight: bold;
    }

    .text-box {
      background: #020617;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 12px;
      padding: 0.8rem;
      margin-bottom: 1rem;
      color: #e5e7eb;
    }

    .top-row {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 1rem;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.7rem;
    }

    .image-box {
      height: 120px;
      border: 2px dashed rgba(148, 163, 184, 0.3);
      border-radius: 12px;
      overflow: hidden;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 0.8rem;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      color: #64748b;
    }

    @media (max-width: 800px) {
      .top-row {
        grid-template-columns: 1fr;
      }

      .image-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
