
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>therescaper Account</title>

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --header: #2c3e50;
      --nav: #34495e;
      --text: #e0e0e0;
      --muted: #b0b0b0;
      --accent: #4da3ff;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    header, footer {
      background-color: var(--header);
      text-align: center;
      padding: 1rem;
      color: white;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      background-color: var(--nav);
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 1rem;
    }

    nav a:hover {
      background-color: var(--header);
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .instructeur {
      background-color: var(--card);
      padding: 1.2rem;
      border-radius: 12px;
    }

    .wins {
      color: var(--accent);
      font-weight: bold;
    }

    .contact-info {
      list-style: none;
      padding: 0;
      margin: 0.5rem 0 1rem 0;
      color: var(--muted);
    }

    .roles {
      padding-left: 1rem;
    }
  </style>
</head>

<body>

<header>
  <h1>therescaper Overwatch</h1>
</header>

<nav>
  <a href="Page1.html">Page 1</a>
  <a href="Page2.html">Page 2</a>
  <a href="Page3.html">Page 3</a>
  <a href="Page4.html">Page 4</a>
</nav>

<main class="container">
  <section class="grid" id="liste"></section>
</main>

<footer>
  &copy; 2025 - therescaper
</footer>

<script>
  const instructeurs = [
    { nom: "therescaper 1", wins: 405 },
    { nom: "therescaper 2", wins: 530 },
    { nom: "therescaper 3", wins: 424 },
    { nom: "therescaper 4", wins: 242 },
    { nom: "therescaper 5", wins: 275 },
    { nom: "therescaper 6", wins: 295 },
    { nom: "therescaper 7", wins: 246 },
    { nom: "therescaper 8", wins: 451 },
    { nom: "therescaper 9", wins: 434 }
  ];

  const container = document.getElementById("liste");

  instructeurs.forEach((i, index) => {
    const card = document.createElement("div");
    card.className = "instructeur";

    card.innerHTML = `
      <h2>${i.nom} <span class="wins">- ${i.wins} wins</span></h2>
      <ul class="contact-info">
        <li>Email : therescaper${index + 1}k@gmail.com</li>
      </ul>
      <ul class="roles">
        <li>Tank</li>
        <li>DPS</li>
        <li>Support</li>
        <li>Open Queue</li>
      </ul>
    `;

    container.appendChild(card);
  });
</script>

</body>
</html>
